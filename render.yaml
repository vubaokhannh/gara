services:
  - type: web
    name: gara-voice-excel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: APP_PIN
        value: "1234"
      - key: DRIVE_WEBHOOK_URL
        sync: false

